<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script nonce="__CSP_NONCE__">try{var s=localStorage.getItem("cp.theme");if(s==="light"||s==="dark"){document.querySelector('meta[name="color-scheme"]').content=s;}}catch(e){}</script>
  <meta name="robots" content="noindex, nofollow">
  <title>AI Control Plane</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css?v=__APP_VERSION__">
  <script type="module" src="/assets/js/main.js?v=__APP_VERSION__"></script>
</head>
<body>
  <div id="app" class="boot-screen" aria-busy="true">
    <div class="boot">
      <div class="boot-mark" aria-hidden="true"></div>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <p class="boot-text">Loading workspace</p>
    </div>
  </div>
  <noscript><p class="noscript">This application requires JavaScript to be enabled.</p></noscript>
</body>
</html>
