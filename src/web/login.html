<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script nonce="__CSP_NONCE__">try{var s=localStorage.getItem("cp.theme");if(s==="light"||s==="dark"){document.querySelector('meta[name="color-scheme"]').content=s;}}catch(e){}</script>
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css?v=__APP_VERSION__">
  <link rel="stylesheet" href="/assets/css/login.css?v=__APP_VERSION__">
  <script type="module" src="/assets/js/login.js?v=__APP_VERSION__"></script>
</head>
<body class="login-page">
  <div class="login-layout">
    <main class="login-main" id="main">
      <div class="login-panel">
        <div class="login-card" id="login-card" aria-busy="true">
          <div class="login-loading" aria-hidden="true">
            <div class="boot-mark"></div>
            <div class="boot-bar"><span></span></div>
          </div>
        </div>
        <footer class="login-footer" id="login-footer"></footer>
      </div>
    </main>
    <aside class="login-aside" id="login-aside" aria-hidden="true"></aside>
  </div>
  <noscript><p class="noscript">This application requires JavaScript to be enabled.</p></noscript>
</body>
</html>
