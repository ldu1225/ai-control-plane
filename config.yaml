# AI Control Plane configuration.
#
# Load order (later wins): built-in defaults < config.yaml < config.local.yaml (same directory,
# optional, not committed) < environment variables < settings saved from the UI (settings store).
# Environment overrides: PROJECT_ID, QUOTA_PROJECT_ID, AUDIT_DATASET_ID, BILLING_PROJECT_ID,
# BILLING_DATASET_ID, BILLING_TABLE_ID, BILLING_ACCOUNT_ID, WORKSPACE_TIMEZONE, ORGANIZATION_NAME,
# PRODUCT_NAME, DEFAULT_LOCALE, AUTH_MODE, IAP_AUDIENCE, ADMIN_EMAILS (comma separated), SETTINGS_BUCKET,
# DISCOVERY_ENGINE_LOCATIONS and AGENT_ENGINE_REGIONS (comma separated), AI_DEFAULT_MODEL, AI_LOCATION,
# HOST, PORT, CONFIG_PATH.
# All values below are placeholders. Replace them per customer or override them with environment
# variables; do not commit customer identifiers to this file.

product:
  name: "AI Control Plane"
  tagline: "Unified governance for Gemini Enterprise and Agent Platform"

branding:
  organization_name: "Your Organization"
  logo_url: ""                 # https URL or /assets/... path; empty shows a generated monogram
  accent_color: "#2563EB"      # #RRGGBB
  default_locale: "en"         # en | ko
  default_theme: "system"      # system | light | dark

server:
  host: "127.0.0.1"            # the container image sets HOST=0.0.0.0
  port: 8088                   # PORT (set by Cloud Run) wins
  cache_ttl_seconds: 120

workspace:
  project_id: "your-gcp-project-id"   # values starting with "your-" mean "not configured"
  quota_project_id: ""                # empty = project_id
  timezone: "UTC"                     # IANA name, for example Asia/Seoul
  default_range_days: 14
  audit_dataset: "ge_analytics"       # BigQuery dataset that receives the log sinks
  billing:
    project_id: ""                    # empty = workspace project
    dataset: "billing_detailed_usage"
    table: "gcp_billing_export_resource_v1_XXXXXX_XXXXXX_XXXXXX"
    account_id: ""                    # XXXXXX-XXXXXX-XXXXXX
  discovery_engine_locations: ["global"]
  agent_engine_regions: ["us-central1"]
  telemetry_datasets: []              # extra datasets scanned by telemetry discovery ("dataset" or "project.dataset")

security:
  # auto (iap on Cloud Run, local otherwise) | google | iap | local
  #   local:  development on one computer only. The loopback caller is the administrator, requests
  #           forwarded by a proxy are not, and Cloud Run refuses this mode. auto falls back to local
  #           only when server.host is a loopback address; otherwise startup stops and asks for
  #           google or iap.
  #   google: the application's own sign-in page (/login) with Google accounts. Only approved
  #           accounts (admins + allowed_users) get a session; others can request access and
  #           administrators approve them in Settings > Access control. Requires google_client_id
  #           plus the GOOGLE_OAUTH_CLIENT_SECRET and SESSION_SECRET environment variables (store
  #           both in Secret Manager). scripts/deploy.sh sets this up (ACCESS_MODE=google_oauth).
  auth_mode: "auto"
  # Expected audience of the signed IAP header. Direct IAP on Cloud Run (recommended):
  #   /projects/PROJECT_NUMBER/locations/REGION/services/SERVICE_NAME
  # Alternatives: /projects/PROJECT_NUMBER/global/backendServices/SERVICE_ID (load balancer),
  #   /projects/PROJECT_NUMBER/apps/PROJECT_ID (App Engine). Empty: signature, expiry and issuer are
  #   still verified, but not the audience (a startup warning is logged).
  iap_audience: ""
  admins: []                   # exact emails or *@domain.com patterns; ADMIN_EMAILS is merged
  allowed_users: []            # google mode: approved viewer accounts, *@domain.com, or * (any Google account); ALLOWED_USERS is merged
  google_client_id: ""         # google mode: OAuth Web client id (GOOGLE_OAUTH_CLIENT_ID)
  public_base_url: ""          # google mode: https://dashboard.example.com (PUBLIC_BASE_URL); fixes the redirect URI
  session_hours: 12            # google mode: session lifetime, 1-168 (SESSION_HOURS)
  # google mode without an OAuth client: URL of the IAP-protected sign-in bridge service
  # (SIGN_IN_BRIDGE_URL). The bridge itself runs the same image with auth_mode iap and
  # bridge_return_url = this dashboard's URL (BRIDGE_RETURN_URL). scripts/deploy.sh sets this up (ACCESS_MODE=google).
  sign_in_bridge_url: ""
  bridge_return_url: ""
  mask_pii_for_viewers: false
  # Demo only (google mode; GUEST_ACCESS, GUEST_REDACT_TERMS): visitors without a session browse read-only as a
  # guest. Guests always get viewer masking plus whole e-mail domains, billing account IDs, 12-digit project
  # numbers and the terms below hidden in every response; they cannot change anything and use the AI Analyst
  # only when analyst.allow_viewers is on. Not editable from the UI. Keep it off for customer deployments.
  guest_access: false
  guest_redact_terms: []       # project, organization or customer names to hide from guests (case-insensitive)

storage:
  backend: "auto"              # auto | file | gcs | memory (auto = gcs if gcs_bucket, else file locally / memory on Cloud Run)
  file_path: "data/settings.json"
  gcs_bucket: ""               # SETTINGS_BUCKET
  gcs_object: "control-plane/settings.json"

bigquery:
  max_bytes_billed: 20000000000   # per dashboard query

ai_engine:
  location: "global"
  default_model: "gemini-3.8-flash"
  models: ["gemini-3.8-flash", "gemini-3.8-pro", "gemini-4-carbon", "gemini-4-argon"]
  discover_models: true
  restrict_to_allowed: true       # only configured (and discovered, if enabled) models are accepted
  # Tried in order when a requested model is not available in this project (for example a preview model).
  fallback_models: ["gemini-2.5-flash", "gemini-3-flash-preview", "gemini-2.5-pro", "gemini-2.5-flash-lite"]

modules:
  overview: true
  gemini_enterprise: true
  notebooklm: true
  model_usage: true
  agent_gateway: true
  agent_registry: true
  agent_deployments: true
  model_armor: true
  users: true
  antigravity: true
  finops: true
  telemetry: true
  analyst: true

model_catalog:
  auto_enable_new_models: true
  disabled_models: []             # model keys, for example gemini-3.8-flash-lite
  excluded_sku_patterns: ["code assist", "duet ai"]   # always enforced, even if removed here
  ai_grouping: false              # optional Gemini refinement of model family names (cached 6 hours)

gateway:
  services:
    - "aiplatform.googleapis.com"
    - "discoveryengine.googleapis.com"
    - "modelarmor.googleapis.com"
    - "businessaicode.googleapis.com"
    - "notebooklm.googleapis.com"
    - "geminidataanalytics.googleapis.com"
    - "generativelanguage.googleapis.com"

agent_lifecycle:
  idle_days: 14
  deprecation_days: 50

finops:
  spike_threshold_pct: 50
  spike_min_delta: 1.0

governance:
  antigravity:
    usage_source: "auto"          # auto | bigquery | logging
    inference_log: "businessaicode.googleapis.com%2Finference_response"
    access_role: "roles/discoveryengine.agentspaceUser"
    cap_marker_role: "CustomAntigravityCapBlocked"
    admin_marker_role: "CustomAntigravityAdminBlocked"
    legacy_marker_roles: ["CustomAntigravityRestrictedUser"]
    privileged_roles: ["roles/owner", "roles/editor", "roles/discoveryengine.admin"]
    extra_access_roles: []
    period: "weekly"              # settlement period: daily | weekly | monthly | all (all = 90 days). Weekly matches
                                  # how Gemini Enterprise enforces Antigravity credits (a shared pool per 7 days)
    window: "calendar"            # calendar (resets at reset_time in reset_timezone) | rolling
    reset_timezone: ""            # IANA zone of calendar period boundaries; empty = the workspace time zone
    reset_weekday: 0              # weekly periods start on this day: 0 = Monday ... 6 = Sunday (set it to the
                                  # day the project's Antigravity credit pool resets)
    reset_time: "00:00"           # HH:MM at which daily / weekly / monthly periods start
    token_cap: 0                  # 0 = disabled (all caps are off until an administrator sets one)
    request_cap: 0                # 0 = disabled
    credit_per_user_month: 10     # Antigravity credit per licensed user and month in USD (Standard 10, Plus 15);
                                  # used by the credit-based cap preset and the monthly usage report
    cost_cap: 0                   # amount per person and period in `currency`, e.g. 1000000 (KRW); 0 = disabled
    currency: ""                  # ISO code of cost caps, e.g. KRW; empty = billing account currency
    pricing_source: "auto"        # auto = price per token the billing account paid (last 30 days), then the
                                  # public Google Cloud price list, converted at the Google exchange rate
                                  # manual = the prices below
    input_price_per_million: 0    # manual prices only; model_prices also override automatic prices
    output_price_per_million: 0   # applies to candidate and thinking tokens
    model_prices: []              # [{model: "gemini-3.8-pro", input: 0, output: 0, cached: 0}] (exact id or prefix;
                                  # cached = prompt tokens served from the prompt cache, optional)
    enforcement_mode: "manual"    # manual = review queue | auto = scheduled runs suspend over-cap users
    scheduler_invokers: []        # SCHEDULER_INVOKERS: service accounts allowed to call the enforce endpoint
                                  # with a Google OIDC token (Cloud Scheduler); requires security.public_base_url
    change_budget_min: 10
    change_budget_ratio: 0.2
    max_log_entries: 20000
    audit_log_name: "agy-admin%2Fadmin_actions"
    webhook_url: ""               # https only; allowed hosts: hooks.slack.com, chat.googleapis.com

# Telemetry Extensions. Nothing here lists known logs: sources are discovered from the project itself (Cloud Logging
# log list, Cloud Monitoring log volume, sampled entries, BigQuery schemas), described from the Service Usage API
# titles and monitored resource descriptors, and profiled and grouped by Gemini. Every value below is also editable
# in Settings > Data collection and cost.
telemetry:
  connectors: []                  # read-only connectors; connectors created in the UI are stored in the settings store
  discovery:                      # limits that only bound the work of one discovery
    max_projects: 8
    max_datasets_per_project: 20  # other datasets of the scanned projects listed automatically (0 = configured only)
    max_tables_per_dataset: 100
    activity_days: 7              # window of the daily volume shown per source
    sample_entries: 300           # entries read in one call to learn payload fields
    targeted_samples: 12          # extra small reads for logs the shared sample missed
    max_log_entries: 1000         # entries a Cloud Logging dashboard reads per view (1000 = one API call)
    dataset_hints: ["log", "audit", "telemetry", "agent", "gemini", "event"]   # scan order only
    hidden_logs: []               # log id substrings never listed
  ai:                             # Gemini describes, maps, values and groups every source (cached per source fingerprint)
    enabled: true
    model: "gemini-4-argon"       # empty = ai_engine.default_model; an unavailable model falls back automatically
    batch_size: 25
    max_sources: 150
    profile_ttl_hours: 168
    share_value_examples: true    # send short, masked examples of low-cardinality values (never prompts or e-mails)
  inference:                      # generic name hints, combined with value statistics (e-mail ratio, cardinality, types)
    time_hints: ["timestamp", "receivetimestamp", "event_time", "event_timestamp", "event_ts", "created_at",
                 "occurred_at", "start_time", "logged_at", "recorded_at", "ts"]
    user_hints: ["principalemail", "user_email", "useremail", "email", "user_id", "userid", "user", "actor",
                 "principal", "caller", "account"]
    model_hints: ["model"]
    token_hints: ["token"]
    operation_hints: ["method", "operation", "action", "event", "step", "tool", "command", "task", "route",
                      "function", "type", "name"]
    status_hints: ["status", "code", "severity", "result", "outcome", "verdict", "reason", "state", "phase", "level"]
    sensitive_hints: ["prompt", "response", "content", "message", "messages", "text", "parts", "instruction", "query"]
  display_renames: ["Vertex AI=Agent Platform"]   # naming policy applied to API titles ("From=To")
  # Log Router -> BigQuery routes created from the dashboard. Routing everything without limits gets expensive, so
  # every route has cost controls (these are the defaults; each route can override sampling, severity, exclusions,
  # its daily budget and retention).
  routing:
    dataset: "telemetry_routed"   # dedicated dataset (TELEMETRY_DATASET), created on first use and labelled
    dataset_location: ""          # empty = location of the audit dataset
    sink_prefix: "acp-tx-"
    sample_percent: 100           # sample(insertId, fraction) in the sink filter
    min_severity: ""              # DEFAULT, DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL, ALERT, EMERGENCY; empty = all
    exclusion_filters: []         # Logging filters excluded from every route, e.g. 'httpRequest.requestUrl:"/healthz"'
    retention_days: 30            # partition expiration of routed tables; 0 = keep
    daily_budget_gb: 5            # GiB per local day for all routes together; 0 = unlimited
    sink_daily_gb: 1              # GiB per local day per route; 0 = unlimited
    over_budget_action: "pause"   # pause (disable the sink until the next local day) | alert (report only)
    auto_resume: true
    max_sinks: 20
    follow_groups: true           # a route made for a Gemini group adds logs that join the group later (within budget)
    notify_webhook_url: ""        # Slack or Google Chat webhook for pause/resume/over-budget events

# Token prices for cost estimates when the billing export is not readable (most customers): observed tokens x
# official prices. Prices come only from the Cloud Billing Catalog API and the Google pricing pages below; there is no
# built-in price table. The check runs daily at sync_time (and on demand from the FinOps page) and records changes.
pricing:
  currency: ""                    # ISO 4217 display currency (PRICING_CURRENCY); empty = Antigravity cap currency, else USD
  sync_time: "00:00"              # local time of the daily price and exchange-rate check (PRICING_SYNC_TIME)
  sync_timezone: ""               # IANA zone; empty = workspace.timezone
  public_sources:                 # official Google pricing pages (*.google.com, *.google.dev only)
    - "https://aistudio.google.com/docs/pricing.md"
    - "https://ai.google.dev/gemini-api/docs/pricing"
    - "https://cloud.google.com/vertex-ai/generative-ai/pricing"
    - "https://cloud.google.com/text-to-speech/pricing"
    - "https://cloud.google.com/speech-to-text/pricing"
  fx_sources:                     # exchange-rate feeds used when the Cloud Billing Catalog has no rate for a currency
    - "https://open.er-api.com/v6/latest/USD"
    - "https://api.frankfurter.dev/v1/latest?base=USD"
  catalog_services:               # Cloud Billing Catalog service display names
    - "Vertex AI"
    - "Agent Platform"
    - "Gemini API"
    - "Cloud Text-to-Speech API"
    - "Cloud Speech API"
  include_partner_models: true    # partner models billed under their own service (for example Claude)
  storage_service: "BigQuery"     # Cloud Billing Catalog service used for telemetry routing cost estimates
  model_aliases: []               # "my-tuned-model=gemini-2.5-flash": price a model like another
  model_overrides: []             # [{model: "acme-llm", input: 1.0, output: 4.0, cached: 0.1}] USD per 1M tokens
  alert_price_change_pct: 0.5     # alert when an official token price moves at least this much
  alert_fx_change_pct: 1.0        # alert when an exchange rate moves at least this much

analyst:
  max_bytes_billed: 10000000000
  max_rows: 500
  allow_viewers: false
